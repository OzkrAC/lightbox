# Squid as the proxy of lightbox containers created with --net proxy:3128.
#
# Such a container reaches port 3128 of lightbox's gateway and nothing else;
# its resolv.conf names no name server. Squid decides which names it may
# reach, looks them up itself, and only for the names on its list: a lookup
# of any other name is never made, so that a name cannot carry data out.
#
# Written for Squid 6 and for lightbox.conf's defaults, subnet = 10.0.0.0/24
# and gw = 10.0.0.1: with others, change http_port and the acl lightbox to
# them. The whole of /etc/squid/squid.conf, not a part to include in a
# distribution's, whose http_port listens on every interface. See README.md.

# Only on the bridge's address, the gateway of the containers. Squid starts
# after `lightbox setup` has made the bridge, or it cannot listen there.
http_port 10.0.0.1:3128

# Who may use it: lightbox's subnet.
acl lightbox src 10.0.0.0/24

# The names they may reach, one a line: "example.com" is that name alone,
# ".example.com" it and every name under it. -n: a request for an address is
# not looked up to a name, so it matches nothing and is refused.
acl allowed dstdomain -n "/etc/squid/lightbox-allowed-domains"

# What no name on the list may lead to, whatever it resolves to: the host
# and its networks, the other containers, the clouds' metadata services and
# every other range that is no one's on the internet, as lightbox's
# --net outside refuses them. Looked up only for a name on the list. Not
# ::ffff:0:0/96: Squid holds every IPv4 address in that form, so it would
# match them all; the IPv4 ranges stand for it.
acl internal dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl internal dst 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/3
acl internal dst ::/128 ::1/128 64:ff9b::/96 fc00::/7 fe80::/10 ff00::/8

# HTTPS goes through CONNECT, to port 443 alone; plain HTTP to port 80 alone.
acl tunnel method CONNECT
acl tls_port port 443
acl web_port port 80

# In this order: the checks that need no lookup before the one that does.
http_access deny !lightbox
http_access deny tunnel !tls_port
http_access deny !tunnel !web_port
http_access deny !allowed
http_access deny internal
http_access allow lightbox
http_access deny all

# The other end learns nothing of the container, and nothing is kept: what
# one container fetched is no other's.
forwarded_for delete
via off
httpd_suppress_version_string on
cache deny all
