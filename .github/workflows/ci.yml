name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no root: the header check, the analyzer gate and the
  # unit, validation and seccomp suites.
  check:
    name: Checks (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 14 is the compiler the analyzer gate is kept clean for.
          - name: x86_64
            runner: ubuntu-24.04
            cc: gcc-14
            packages: gcc-14 gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            targets: check
          # What Ubuntu 24.04 installs as gcc: GCC 13, which knows C23 as
          # -std=c2x. An analyzer's findings change from release to release,
          # so the gate is not run with this one.
          - name: x86_64 with GCC 13
            runner: ubuntu-24.04
            cc: gcc
            packages: gcc
            targets: check-sys test
          # A native arm64 runner. qemu-user would not do: it refuses to
          # install a seccomp filter.
          - name: aarch64
            runner: ubuntu-24.04-arm
            cc: gcc-14
            packages: gcc-14
            targets: check
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # apt asks a mirror again that does not answer for 30 s, three times. In
      # the first run of this workflow for Track I, on 2026-11-23, this step
      # of two jobs on x86_64 took the job's 15 minutes and was cancelled,
      # while the same step of other jobs took 10 s to 3 minutes.
      - name: Install the toolchain
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/80-lightbox-ci > /dev/null
          sudo apt-get update
          sudo apt-get install -y ninja-build uidmap libarchive-tools skopeo ${{ matrix.packages }}
      # Ubuntu's AppArmor keeps unprivileged processes from using user
      # namespaces. The seccomp suite makes one to watch the filter refuse
      # the next; with the restriction on, it skips that case.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # The unit suite's case of a --userns volume needs a user namespace with
      # ids besides its root's: newuidmap, from uidmap, and a range of the
      # runner's in /etc/subuid and /etc/subgid. Without them it skips.
      - name: Give the runner a range of ids
        run: |
          for f in /etc/subuid /etc/subgid; do
              grep -q "^$(id -un):" "$f" 2>/dev/null || echo "$(id -un):100000:65536" | sudo tee -a "$f" >/dev/null
          done
      - name: Build
        run: make CC=${{ matrix.cc }}
      - name: Check
        run: make CC=${{ matrix.cc }} ${{ matrix.targets }}
      - name: Kernel log
        if: ${{ failure() }}
        run: sudo dmesg | tail -n 60

  # The suite that starts containers: tests/lifecycle.sh, as root. It works in
  # private network, mount and PID namespaces and fails if it leaves anything
  # on the runner. It runs six times on each architecture: on the suite's own
  # image as it is, with every container made with --userns, with --userns
  # --copy and with --seccomp deny; and on the Alpine and the Debian image
  # that the allow-list, the default, is fitted to.
  lifecycle:
    name: Lifecycle suite (${{ matrix.arch }}${{ matrix.mode.name && format(', {0}', matrix.mode.name) || '' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        mode:
          - { name: '',             userns: '',      seccomp: '',   image: '' }
          - { name: userns overlay, userns: overlay, seccomp: '',   image: '' }
          - { name: userns copy,    userns: copy,    seccomp: '',   image: '' }
          - { name: seccomp deny,   userns: '',      seccomp: deny, image: '' }
          - { name: Alpine,         userns: '',      seccomp: '',   image: alpine }
          - { name: Debian,         userns: '',      seccomp: '',   image: debian }
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Squid for contrib/proxy's example, which the suite runs in its own
      # namespaces: the service that the package starts is not needed.
      - name: Install the toolchain and what the suite needs
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/80-lightbox-ci > /dev/null
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 busybox-static iproute2 iptables nftables util-linux strace squid skopeo
          sudo systemctl disable --now squid || true
      - name: Build
        run: make CC=gcc-14
      # The suite makes bridge and veth interfaces, and lightbox's firewall
      # rules use the state match, masquerading and, for --net outside, the
      # address type match and rejection, in iptables and in nftables, whose
      # bridge family needs nft_meta_bridge. Runner kernels keep some modules
      # in a package of extras.
      - name: Kernel modules
        run: |
          missing=
          for m in bridge veth br_netfilter xt_state xt_conntrack xt_MASQUERADE xt_addrtype ipt_REJECT nf_nat nf_tables nft_meta_bridge nft_masq nft_chain_nat nft_ct nft_reject_ipv4; do
            sudo modprobe -n "$m" 2>/dev/null || missing="$missing $m"
          done
          if [ -n "$missing" ]; then
            echo "not available:$missing"
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" ||
              echo "no package of extra modules for this kernel; the suite will say what it cannot do"
          else
            echo "all available"
          fi
      - name: Host facts
        run: |
          uname -srm
          echo "cgroup controllers: $(cat /sys/fs/cgroup/cgroup.controllers)"
          echo "enabled below the root: $(cat /sys/fs/cgroup/cgroup.subtree_control)"
          iptables --version
          nft --version
          ip -V
          busybox | head -n 1
          unshare --version
          echo "loaded: $(lsmod | awk '{ print $1 }' | grep -E '^(bridge|veth|br_netfilter|nf_tables|nft_compat|nf_nat|xt_.*)$' | sort | tr '\n' ' ')"
      # The image, pinned by its SHA-256 in the script, which fails the job if
      # the file it gets is another.
      - name: Fetch the image
        if: ${{ matrix.mode.image != '' }}
        run: sudo tests/fetch_image.sh ${{ matrix.mode.image }} "$RUNNER_TEMP/image"
      # And as its registry has it, by the digest of its manifest: a directory
      # that one case makes a base with base import (ROADMAP I.9).
      - name: Fetch the image as a registry has it
        if: ${{ matrix.mode.image != '' }}
        run: tests/fetch_image.sh --oci ${{ matrix.mode.image }} "$RUNNER_TEMP/oci"
      # sudo drops the environment, so the suite's options are make variables.
      # It takes 3 to 4 minutes, and once took 11.5 on an aarch64 runner. Its
      # limit is below the job's, so that a suite that hangs fails this step
      # and the kernel log is still read, where a job that is cancelled at
      # its limit runs nothing more.
      - name: Lifecycle suite
        timeout-minutes: 15
        run: >-
          sudo make CC=gcc-14 test-lifecycle GITHUB_ACTIONS=true LIGHTBOX_TEST_MODPROBE=1
          LIGHTBOX_TEST_USERNS=${{ matrix.mode.userns }} LIGHTBOX_TEST_SECCOMP=${{ matrix.mode.seccomp }}
          LIGHTBOX_TEST_ROOTFS=${{ matrix.mode.image && format('{0}/image', runner.temp) || '' }}
          LIGHTBOX_TEST_IMAGE=${{ matrix.mode.image && format('{0}/oci', runner.temp) || '' }}
      # Wall time of the basic commands, the processes one start makes and
      # creates from a base of 1 GB. A shared runner's clock is rough, so this
      # reports and compares nothing. The numbers are a notice on the run's
      # page.
      - name: Timing
        if: ${{ matrix.mode.name == '' }}
        run: sudo make CC=gcc-14 bench GITHUB_ACTIONS=true
      - name: Kernel log
        if: ${{ failure() }}
        run: sudo dmesg | tail -n 80

  # README's "make CC=aarch64-linux-gnu-gcc", with the compiler Ubuntu ships
  # under that name. AR and STRIP follow from the prefix.
  cross:
    name: Cross-build for aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install the toolchain
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/80-lightbox-ci > /dev/null
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu
      - name: Build
        run: make CC=aarch64-linux-gnu-gcc
      - name: The result is a static aarch64 executable
        run: |
          file lightbox
          file lightbox | grep -q 'ARM aarch64'
          file lightbox | grep -q 'statically linked'

  # The .deb and the .xbps, for both architectures: each is built, installed
  # and used, and kept as an artifact of the run. packages.yml has the jobs.
  packages:
    name: Packages
    uses: ./.github/workflows/packages.yml
