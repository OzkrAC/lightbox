name: docs

# Publishes docs/ to GitHub Pages. The pages are Luccet notes, which the
# browser renders, so there is nothing to build: the directory is uploaded as
# it is. The repository's Pages source has to be "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# What a Pages deployment needs, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; one that is under way is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
