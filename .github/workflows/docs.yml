name: docs

# Publishes docs/ to GitHub Pages. The pages are Luccet notes, which the
# browser renders, so there is nothing to build: the directory is uploaded as
# it is. The repository's Pages source has to be "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# What a Pages deployment needs, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; one that is under way is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

# The upload and the deployment are two jobs. deploy-pages looks the artifact
# up by its name, and in one job that came a fraction of a second after the
# upload and found none, though the run had it (actions/deploy-pages, issue
# 451). In two jobs the deployment starts seconds later, and "Re-run failed
# jobs" runs it alone, against the one artifact the run has: a second upload
# to the same run is a second artifact of that name, which is refused.
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
